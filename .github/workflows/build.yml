name: Build CodeSniper

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile main.cpp
      run: |
        cl.exe /EHsc /std:c++20 /MD main.cpp /link /OUT:CodeSniper.exe /SUBSYSTEM:CONSOLE /MACHINE:X64 user32.lib gdi32.lib windowsapp.lib runtimeobject.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeSniper
        path: CodeSniper.exe
